name: Release

# Builds the CPCBuild release: both .vsix, one SDK archive (cpcbuild-sdk-<ver>.zip, every platform) and SHA256SUMS.
#
#   tag v0.2.0, v0.2.0-rc1 ...   build, smoke-test on Linux, macOS and Windows, publish a GitHub release (a PRE-release
#                                when the tag has a suffix such as -rc1)
#   push to release-*            build + smoke test, artifacts only (version 0.0.0-<sha7>)
#   workflow_dispatch            the same; the file must be on the default branch for the button to appear
#
# The compiler is cpcbas, checked out at the commit pinned in cpcbas.json and built here (.github/actions/cpcbas).
# Jobs:  meta -> vsix (both extensions, composite action .github/actions/vsix)
#               reference (Lamplighter's lamp464.bin from the pinned cpcbas checkout)
#        sdk   (needs vsix) packaging/make-sdk.py: the bundled compiler (bin/cpcbas.mjs), its library, docs, examples,
#               both games and both .vsix, as one archive
#        smoke (needs sdk, reference) each platform's runner unpacks the archive and builds lamp464 with the SDK's own
#               `node bin/cpcbas.mjs` (packaging/smoke.py): the .bin must equal the reference byte for byte
#        publish (tags only, needs smoke) gh release create (--prerelease for v*-suffix tags)

on:
  push:
    tags: ['v*']
    branches: ['release-*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      cpcbas: ${{ steps.v.outputs.cpcbas }}
      cpcbas_commit: ${{ steps.v.outputs.cpcbas_commit }}
      is_tag: ${{ steps.v.outputs.is_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: cpcbas.json
      - id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi
          echo "cpcbas=$(jq -r .version cpcbas.json)" >> "$GITHUB_OUTPUT"
          echo "cpcbas_commit=$(jq -r .commit cpcbas.json)" >> "$GITHUB_OUTPUT"
          echo "pinned cpcbas: $(jq -c . cpcbas.json)"

  vsix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout cpcbuild
        uses: actions/checkout@v7
        with:
          path: cpcbuild
      - uses: ./cpcbuild/.github/actions/vsix
      - name: Upload the .vsix files
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: |
            cpcbuild/vscode/cpcbuild-studio/*.vsix
            cpcbuild/vscode/cpcbuild-emu/*.vsix
          if-no-files-found: error

  reference:
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout cpcbuild
        uses: actions/checkout@v7
        with:
          path: cpcbuild
      - uses: ./cpcbuild/.github/actions/cpcbas
      - name: Build lamp464 with the pinned cpcbas (the flags of the Studio's lamp464 target)
        working-directory: cpcbuild/games/lamplighter
        run: |
          mkdir -p "$RUNNER_TEMP/ref"
          node "$CPCBAS/packages/cpcbas/dist/bin/cpcbas.js" --org 0x40 -D CPC464 \
            -o "$RUNNER_TEMP/ref/lamp464.bin" main.bas
          ls -l "$RUNNER_TEMP/ref"
      - uses: actions/upload-artifact@v7
        with:
          name: lamp464-reference
          path: ${{ runner.temp }}/ref/lamp464.bin
          if-no-files-found: error

  sdk:
    needs: [meta, vsix]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VER: ${{ needs.meta.outputs.version }}
    steps:
      - name: Checkout cpcbuild
        uses: actions/checkout@v7
        with:
          path: cpcbuild
      - uses: ./cpcbuild/.github/actions/cpcbas
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: vsix
      - name: Assemble the SDK archive
        run: |
          python3 cpcbuild/packaging/make-sdk.py --version "$VER" --cpcbas "$CPCBAS" \
            --studio-vsix "$(find vsix -name 'cpcbuild-studio-*.vsix' | head -1)" \
            --emu-vsix "$(find vsix -name 'cpcbuild-emu-*.vsix' | head -1)" \
            --cpcbuild-ref "$GITHUB_REF_NAME" --out out
          ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: sdk
          path: out/*
          compression-level: 0
          if-no-files-found: error

  smoke:
    needs: [meta, sdk, reference]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: packaging
      # Python only runs the harness (smoke.py); the SDK's own CLI, on Node 22, is what builds the game
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: sdk
          path: sdk
      - uses: actions/download-artifact@v8
        with:
          name: lamp464-reference
          path: ref
      - name: Unpack the SDK and build lamp464 with its bin/cpcbas.mjs
        shell: bash
        run: python packaging/smoke.py "sdk/cpcbuild-sdk-${{ needs.meta.outputs.version }}.zip" ref/lamp464.bin

  publish:
    if: needs.meta.outputs.is_tag == 'true'
    needs: [meta, vsix, sdk, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VER: ${{ needs.meta.outputs.version }}
      CVER: ${{ needs.meta.outputs.cpcbas }}
      CCOMMIT: ${{ needs.meta.outputs.cpcbas_commit }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sdk
          path: out
      - name: Create the release
        run: |
          cat > notes.md <<EOF
          CPCBuild $VER.

          - CPCBuild tag: \`$GITHUB_REF_NAME\` (commit \`$GITHUB_SHA\`)
          - Compiler: cpcbas \`$CVER\` (commit \`$CCOMMIT\`, pinned in \`cpcbas.json\`), bundled in the SDK and in CPC Game Studio
          - \`cpcbuild-sdk-$VER.zip\`: one archive for Windows, macOS and Linux: the compiler (\`bin/cpcbas.mjs\`, needs Node.js 22 for the command line), library, docs, examples, both games and both extensions; start with \`README-FIRST.txt\`
          - \`cpcbuild-studio-$VER.vsix\`, \`cpcbuild-emu-$VER.vsix\`: the two VS Code extensions on their own
          - \`SHA256SUMS\`: checksums of every file here
          - Licences: AGPL-3.0 (compiler; the CPC Game Studio .vsix is a combined work under it, its own sources are MIT), MIT (CPCBuild, runtime library), GPL-3.0-or-later (emulator extension); sources are listed in the SDK's \`SOURCES.txt\`

          The SDK was unpacked on Linux, macOS and Windows runners and built Lamplighter's lamp464 with its own \`bin/cpcbas.mjs\`, byte-identical to the build with the pinned compiler checkout.
          EOF
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag $pre \
            --title "CPCBuild $VER" --notes-file notes.md out/*
