name: Release

# Builds the CPCBuild release: both .vsix, six SDK archives (cpcbuild-sdk-<ver>-<platform>) and SHA256SUMS.
#
#   tag v0.1.0, v0.1.0-rc1 ...   build, smoke-test on every platform, publish a GitHub release (a PRE-release
#                                when the tag has a suffix such as -rc1)
#                                (compiler-style tags such as v1.19.0-cpc.1 belong to carcharo/zxbasic and are ignored)
#   push to release-*            build + smoke test, artifacts only (version 0.0.0-<sha7>)
#   workflow_dispatch            the same; the file must be on the default branch for the button to appear
#
# Jobs:  meta -> vsix (both extensions, composite action .github/actions/vsix)
#               reference (Lamplighter lamp464.bin from the source compiler at the pinned tag, poetry)
#        sdk   (needs vsix) packaging/make-sdk.py: the pinned compiler release assets (tools-manifest.json,
#               checked against its SHA256SUMS) + docs, lib, examples, Lamplighter + both .vsix, all six platforms
#        smoke (needs sdk, reference) each platform's runner unpacks its archive and builds lamp464 with the SDK's own
#               bin/zxbc and bin/mkdsk (packaging/smoke.py): the .bin must equal the reference byte for byte
#        publish (tags only, needs smoke) gh release create (--prerelease for v*-suffix tags)
# The compiler release (carcharo/zxbasic, tag v<zxbasic.version of vscode/cpcbuild-studio/tools-manifest.json>)
# must exist before this runs.

on:
  push:
    tags: ['v*', '!v*-cpc.*']
    branches: ['release-*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      compiler: ${{ steps.v.outputs.compiler }}
      is_tag: ${{ steps.v.outputs.is_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: vscode/cpcbuild-studio/tools-manifest.json
      - id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi
          c=$(python3 -c "import json;print(json.load(open('vscode/cpcbuild-studio/tools-manifest.json'))['zxbasic']['version'])")
          echo "compiler=$c" >> "$GITHUB_OUTPUT"
          echo "pinned compiler: $c"

  vsix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout cpcbuild
        uses: actions/checkout@v7
        with:
          path: cpcbuild
      - uses: ./cpcbuild/.github/actions/vsix
      - name: Upload the .vsix files
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: |
            cpcbuild/vscode/cpcbuild-studio/*.vsix
            cpcbuild/vscode/cpcbuild-emu/*.vsix
          if-no-files-found: error

  reference:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout cpcbuild
        uses: actions/checkout@v7
        with:
          path: cpcbuild
      - uses: ./cpcbuild/.github/actions/setup
        with:
          chips: 'false'
          zxbasic-ref: v${{ needs.meta.outputs.compiler }}
      - name: Build lamp464 with the source compiler (the flags of games/lamplighter/build_cpc.sh)
        working-directory: zxbasic
        run: |
          mkdir -p "$RUNNER_TEMP/ref"
          poetry run zxbc --arch cpc --org 0x40 -I "$GITHUB_WORKSPACE/cpcbuild/lib" -D CPC464 \
            -o "$RUNNER_TEMP/ref/lamp464.bin" "$GITHUB_WORKSPACE/cpcbuild/games/lamplighter/main.bas"
          ls -l "$RUNNER_TEMP/ref"
      - uses: actions/upload-artifact@v7
        with:
          name: lamp464-reference
          path: ${{ runner.temp }}/ref/lamp464.bin
          if-no-files-found: error

  sdk:
    needs: [meta, vsix]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      VER: ${{ needs.meta.outputs.version }}
      CVER: ${{ needs.meta.outputs.compiler }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: vsix
      - name: Download the pinned compiler release (carcharo/zxbasic v${{ needs.meta.outputs.compiler }})
        run: |
          mkdir compiler
          gh release download "v$CVER" -R carcharo/zxbasic -D compiler \
            -p "zxbasic-$CVER-*" -p SHA256SUMS
          ls -l compiler
          (cd compiler && grep " zxbasic-$CVER-" SHA256SUMS | sha256sum -c -)
      - name: Assemble the six SDK archives
        run: |
          python3 packaging/make-sdk.py --version "$VER" --compiler-dir compiler \
            --studio-vsix "$(find vsix -name 'cpcbuild-studio-*.vsix' | head -1)" \
            --emu-vsix "$(find vsix -name 'cpcbuild-emu-*.vsix' | head -1)" \
            --cpcbuild-ref "$GITHUB_REF_NAME" --out out
          ls -l out
      - name: Executable bits survive in the archives
        run: |
          tar tvzf "out/cpcbuild-sdk-$VER-linux-x64.tar.gz" | grep -E ' [^ ]*/bin/(zxbc|mkdsk)$' | grep -- '-rwx'
          zipinfo "out/cpcbuild-sdk-$VER-macos-arm64.zip" | grep -E '/bin/(zxbc|mkdsk)$' | grep -- '-rwx'
      - uses: actions/upload-artifact@v7
        with:
          name: sdk
          path: out/*
          compression-level: 0
          if-no-files-found: error

  smoke:
    needs: [meta, sdk, reference]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows-x64, ext: zip }
          # python: the runner's preinstalled 3.14.x (installing another over it fails on windows-11-arm)
          - { os: windows-11-arm, platform: windows-arm64, ext: zip, python: '3.14' }
          - { os: ubuntu-22.04, platform: linux-x64, ext: tar.gz }
          - { os: ubuntu-24.04-arm, platform: linux-arm64, ext: tar.gz }
          - { os: macos-14, platform: macos-arm64, ext: zip }
          - { os: macos-15-intel, platform: macos-x64, ext: zip }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: packaging
      # Python only runs the harness (smoke.py); the SDK's own programs are what builds the game
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python || '3.12' }}
      - uses: actions/download-artifact@v8
        with:
          name: sdk
          path: sdk
      - uses: actions/download-artifact@v8
        with:
          name: lamp464-reference
          path: ref
      - name: Unpack the SDK and build lamp464 with its bin/zxbc and bin/mkdsk
        shell: bash
        run: python packaging/smoke.py "sdk/cpcbuild-sdk-${{ needs.meta.outputs.version }}-${{ matrix.platform }}.${{ matrix.ext }}" ref/lamp464.bin

  publish:
    if: needs.meta.outputs.is_tag == 'true'
    needs: [meta, vsix, sdk, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VER: ${{ needs.meta.outputs.version }}
      CVER: ${{ needs.meta.outputs.compiler }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sdk
          path: out
      - name: Create the pre-release
        run: |
          cat > notes.md <<EOF
          CPCBuild $VER.

          - CPCBuild tag: \`$GITHUB_REF_NAME\` (commit \`$GITHUB_SHA\`)
          - Compiler: carcharo/zxbasic \`v$CVER\` (pinned in CPCBuild Studio's tools-manifest.json), unchanged in each SDK's \`bin/\`
          - \`cpcbuild-sdk-$VER-<platform>\`: compiler, library, docs, examples, Lamplighter and both extensions; start with \`README-FIRST.txt\`
          - \`cpcbuild-studio-$VER.vsix\`, \`cpcbuild-emu-$VER.vsix\`: the two VS Code extensions on their own
          - \`SHA256SUMS\`: checksums of every file here
          - Licences: MIT (CPCBuild), AGPL-3.0 (compiler), GPL-3.0-or-later (emulator extension); sources are listed in each SDK's \`SOURCES.txt\`

          Each SDK was unpacked on its own platform's runner and built Lamplighter's lamp464 byte-identical to the source compiler's output.
          EOF
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag $pre \
            --title "CPCBuild $VER" --notes-file notes.md out/*
