name: CI

# Job layout (all run in parallel after the tiny `gate` job; wall time ~ slowest job):
#   zxbasic-tests  zxbasic pytest (compiler suite)
#   chips          make unit test-chips   (firmware conformance 6128/464 + screens)
#   bare-disc      make test-bare-disc    (bare-metal disc start + screens)
#   bare-cold      make test-bare-cold    (cold start, no firmware + screens)
#   zx-games       make test-zx test-games
#   plus           build patched Caprice32 (tools/caprice32) at the pinned commit, make test-plus
#                  (6128 Plus: smoke tests, conformance firmware + bare, screens), then
#                  build CPCEC (tools/cpcec: pinned commit + our patch) and make test-cpcec
# `make ci` runs the same targets serially (local all-in-one). Shared setup lives in
# .github/actions/setup. Each failing job uploads its own screen-diff artifact.
#
# Nightly: cpcbuild CI uses zxbasic's cpc-arch HEAD, but a zxbasic-only push does not
# trigger it. A daily `schedule` run (default branch) goes through `gate`
# (.github/scripts/gate.sh), which lets the test jobs run only if cpc-arch has a
# commit from the last 25 hours. push / pull_request / workflow_dispatch always run.
# Docs-only changes (**.md, docs/**) skip push/PR runs; superseded runs are cancelled.

on:
  push:
    branches: [main, 'phase-*', 'pre-*']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main, 'phase-*', 'pre-*']
    paths-ignore: ['**.md', 'docs/**']
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/gate.sh

  zxbasic-tests:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout cpcbuild
        uses: actions/checkout@v7
        with:
          path: cpcbuild
      - uses: ./cpcbuild/.github/actions/setup
        with:
          chips: 'false'
      - name: zxbasic tests
        working-directory: zxbasic
        run: poetry run pytest -q --no-cov

  chips:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout cpcbuild
        uses: actions/checkout@v7
        with:
          path: cpcbuild
      - uses: ./cpcbuild/.github/actions/setup
        with:
          chips: 'true'
      - name: make unit test-chips
        working-directory: cpcbuild
        env:
          ZXBASIC: ${{ github.workspace }}/zxbasic
          CPC_ROM_DIR: ${{ github.workspace }}/caprice32/rom
        run: make unit test-chips
      - name: Upload screen-test diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screen-diffs-chips
          path: |
            cpcbuild/tests/**/*.actual.png
            cpcbuild/tests/**/*.diff.png
            cpcbuild/games/**/*.actual.png
            cpcbuild/games/**/*.diff.png
          if-no-files-found: ignore

  bare-disc:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout cpcbuild
        uses: actions/checkout@v7
        with:
          path: cpcbuild
      - uses: ./cpcbuild/.github/actions/setup
        with:
          chips: 'true'
      - name: make test-bare-disc
        working-directory: cpcbuild
        env:
          ZXBASIC: ${{ github.workspace }}/zxbasic
          CPC_ROM_DIR: ${{ github.workspace }}/caprice32/rom
        run: make test-bare-disc
      - name: Upload screen-test diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screen-diffs-bare-disc
          path: |
            cpcbuild/tests/**/*.actual.png
            cpcbuild/tests/**/*.diff.png
            cpcbuild/games/**/*.actual.png
            cpcbuild/games/**/*.diff.png
          if-no-files-found: ignore

  bare-cold:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout cpcbuild
        uses: actions/checkout@v7
        with:
          path: cpcbuild
      - uses: ./cpcbuild/.github/actions/setup
        with:
          chips: 'true'
      - name: make test-bare-cold
        working-directory: cpcbuild
        env:
          ZXBASIC: ${{ github.workspace }}/zxbasic
          CPC_ROM_DIR: ${{ github.workspace }}/caprice32/rom
        run: make test-bare-cold
      - name: Upload screen-test diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screen-diffs-bare-cold
          path: |
            cpcbuild/tests/**/*.actual.png
            cpcbuild/tests/**/*.diff.png
            cpcbuild/games/**/*.actual.png
            cpcbuild/games/**/*.diff.png
          if-no-files-found: ignore

  zx-games:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout cpcbuild
        uses: actions/checkout@v7
        with:
          path: cpcbuild
      - uses: ./cpcbuild/.github/actions/setup
        with:
          chips: 'true'
      - name: make test-zx test-games
        working-directory: cpcbuild
        env:
          ZXBASIC: ${{ github.workspace }}/zxbasic
          CPC_ROM_DIR: ${{ github.workspace }}/caprice32/rom
        run: make test-zx test-games
      - name: Upload screen-test diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screen-diffs-zx-games
          path: |
            cpcbuild/tests/**/*.actual.png
            cpcbuild/tests/**/*.diff.png
            cpcbuild/games/**/*.actual.png
            cpcbuild/games/**/*.diff.png
          if-no-files-found: ignore

  plus:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout cpcbuild
        uses: actions/checkout@v7
        with:
          path: cpcbuild
      - uses: ./cpcbuild/.github/actions/setup
        with:
          chips: 'false'
      - name: Cache the patched Caprice32 build
        id: cap32cache
        uses: actions/cache@v6
        with:
          path: cpcbuild/tools/caprice32/work
          key: cap32-${{ runner.os }}-${{ hashFiles('cpcbuild/tools/caprice32/fetch_build.sh', 'cpcbuild/tools/caprice32/caprice32-asic-regs.patch') }}
      - name: Build Caprice32 (pinned commit + caprice32-asic-regs.patch; headless use via SDL dummy video, no audio)
        if: steps.cap32cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libsdl2-dev libfreetype6-dev zlib1g-dev libpng-dev
          sh cpcbuild/tools/caprice32/fetch_build.sh
      - name: Use cpcrun's generated Caprice32 config
        # cap32.cfg is tracked in the caprice32 repo; cpcrun.py fills in
        # cap32.cfg.tmpl itself when it is absent. Remove it on every run (a
        # cache hit skips the build step), or the tracked file's paths are used.
        run: rm -f cpcbuild/tools/caprice32/work/src/cap32.cfg
      - name: Runtime libraries for a cached cap32
        if: steps.cap32cache.outputs.cache-hit == 'true'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0 libfreetype6 libpng16-16
      - name: make test-plus
        working-directory: cpcbuild
        env:
          ZXBASIC: ${{ github.workspace }}/zxbasic
          SDL_AUDIODRIVER: dummy
        run: make test-plus
      - name: Cache the CPCEC build
        id: cpceccache
        uses: actions/cache@v6
        with:
          path: |
            cpcbuild/tools/cpcec/work/cpcec
            cpcbuild/tools/cpcec/work/*.rom
          key: cpcec-${{ runner.os }}-${{ hashFiles('cpcbuild/tools/cpcec/fetch_build.sh', 'cpcbuild/tools/cpcec/cpcbuild.patch') }}
      - name: Build CPCEC (pinned commit + cpcbuild.patch, SDL2)
        if: steps.cpceccache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev
          sh cpcbuild/tools/cpcec/fetch_build.sh
      - name: Runtime SDL2 for a cached CPCEC
        if: steps.cpceccache.outputs.cache-hit == 'true'
        run: sudo apt-get install -y libsdl2-2.0-0
      - name: make test-cpcec
        # CPCEC runs with its own --headless (SDL dummy video and audio, no window)
        working-directory: cpcbuild
        env:
          ZXBASIC: ${{ github.workspace }}/zxbasic
        run: make test-cpcec
      - name: Upload screen-test diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screen-diffs-plus
          path: |
            cpcbuild/tests/**/*.actual.png
            cpcbuild/tests/**/*.diff.png
          if-no-files-found: ignore
