name: Setup CPCBuild CI
description: >
  Shared job setup. Expects cpcbuild already checked out at ./cpcbuild (needed to
  reach this action). Builds cpcbas at the commit pinned in cpcbuild/cpcbas.json (and
  exports CPCBAS), fetches the pinned ROMs, sets up Python with Pillow, and optionally
  the chips cache + build.
inputs:
  python-version:
    default: '3.14.3'
  # Pinned: ROMs come from this caprice32 commit (rom/ only). Keep in sync with SHA in
  # tools/caprice32/fetch_build.sh, which the plus job uses to build the patched cap32.
  caprice32-sha:
    default: a0d78f0f7c6d19a5d3205d1b231bd4da100ec6f3
  # Keep in sync with SHA in tools/chipsrun/fetch_chips.sh (cache key only).
  chips-sha:
    default: 9e88298ce56319953ac7a43213a1120359f7a3a6
  chips:
    description: 'true to restore the chips cache and build chipsrun'
    default: 'false'
runs:
  using: composite
  steps:
    - name: Build cpcbas at the pin
      uses: ./cpcbuild/.github/actions/cpcbas

    - name: Fetch CPC ROMs (caprice32 rom/ at pinned commit)
      uses: actions/checkout@v7
      with:
        repository: ColinPitrat/caprice32
        ref: ${{ inputs.caprice32-sha }}
        path: caprice32
        sparse-checkout: rom
        sparse-checkout-cone-mode: true

    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install cpcbuild tool dependencies
      shell: bash
      run: pip install Pillow

    - name: Cache chips checkout
      if: inputs.chips == 'true'
      uses: actions/cache@v6
      with:
        path: cpcbuild/tools/chipsrun/chips
        key: chips-${{ inputs.chips-sha }}

    - name: Build chips runners
      if: inputs.chips == 'true'
      shell: bash
      working-directory: cpcbuild
      run: make chips
